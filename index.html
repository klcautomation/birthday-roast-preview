<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Birthday Roast 🎂🔥</title>
<style>
:root{--pink:#ff4f9a;--orange:#ff9f1c;--yellow:#ffe066;--blue:#3a86ff;--purple:#8338ec;--ink:#22223b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 10% 10%,#fff3b0 0 12%,transparent 13%),radial-gradient(circle at 90% 20%,#ffd6e8 0 10%,transparent 11%),radial-gradient(circle at 80% 90%,#c8e7ff 0 14%,transparent 15%),linear-gradient(160deg,#fff7d6,#ffe3f1 55%,#dff1ff)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 28px}
header{text-align:center;margin:6px 0 14px}
h1{font-size:2rem;line-height:1.05;margin:0;letter-spacing:.5px;
background:linear-gradient(90deg,var(--pink),var(--orange),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:6px 0 0;font-size:1rem;color:#5c5470}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 0 rgba(131,56,236,.18),0 14px 30px rgba(0,0,0,.08);border:3px solid #fff}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:.98rem}
input,select{width:100%;font:inherit;font-size:1.05rem;padding:12px 12px;border:2px solid #e3dcf5;border-radius:14px;background:#fbf9ff;color:var(--ink)}
input:focus,select:focus{outline:3px solid var(--yellow);border-color:var(--purple)}
.row{display:grid;grid-template-columns:1fr;gap:0 14px}
.check{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-weight:700}
.check input{width:24px;height:24px;accent-color:var(--pink)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{flex:1 1 140px;font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:14px 12px;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#go{background:linear-gradient(90deg,var(--pink),var(--orange))}
#again{background:var(--blue)}
#print{background:var(--purple)}
button:disabled{opacity:.45;cursor:not-allowed}
.err{color:#c1121f;font-weight:700;min-height:1.3em;margin:8px 0 0}
#out{margin-top:18px;display:none}
#out.show{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.roast{background:linear-gradient(180deg,#fffdf2,#fff);border:3px dashed var(--orange)}
.roast h2{margin:0 0 10px;font-size:1.5rem;text-align:center}
.roast ol{margin:0;padding-left:1.4em}
.roast li{font-size:1.15rem;line-height:1.45;margin:0 0 10px}
.roast li.final{list-style:none;margin-left:-1.4em;text-align:center;font-weight:800;font-size:1.25rem;color:var(--pink)}
.hint{font-size:.9rem;color:#6b6585;text-align:center;margin:10px 0 0}
footer{text-align:center;font-size:.75rem;color:#8a84a0;margin-top:22px}
@media(min-width:700px){.row{grid-template-columns:1fr 1fr}h1{font-size:3rem}.wrap{padding-top:34px}}
@media print{
 body{background:#fff}header .tag,.card.form,.hint,footer{display:none}
 #out{display:block!important;margin:0}.roast{border:2px solid #999;box-shadow:none}
 h1{color:#000;background:none;-webkit-text-fill-color:#000}
 .roast li{font-size:16pt}.roast li.final{color:#000}
}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>🎂 Birthday Roast 🔥</h1>
 <p class="tag">Silly, gentle, totally kid-friendly. Read it out loud at the party!</p>
</header>

<div class="card form">
 <form id="f" autocomplete="off" novalidate>
 <div class="row">
  <div>
   <label for="name">Birthday kid's first name</label>
   <input id="name" maxlength="20" placeholder="e.g. Maya" inputmode="text">
  </div>
  <div>
   <label for="age">Age they're turning</label>
   <select id="age"></select>
  </div>
  <div>
   <label for="fav">Their favorite thing</label>
   <select id="fav">
    <option value="dino">Dinosaurs</option>
    <option value="games">Video games</option>
    <option value="soccer">Soccer / sports</option>
    <option value="unicorn">Unicorns</option>
    <option value="slime">Slime</option>
    <option value="lego">LEGO / building</option>
    <option value="draw">Drawing / art</option>
    <option value="dance">Dancing</option>
    <option value="space">Space &amp; rockets</option>
    <option value="cars">Trucks &amp; cars</option>
   </select>
  </div>
  <div>
   <label for="habit">Their funny habit</label>
   <select id="habit">
    <option value="snacks">Always asking for snacks</option>
    <option value="shoe">Losing one shoe</option>
    <option value="bedtime">Stalling at bedtime</option>
    <option value="zoomies">Random zoomies</option>
    <option value="hair">Wild morning hair</option>
    <option value="why">Asking "why?" nonstop</option>
    <option value="sing">Singing the same song on repeat</option>
    <option value="faces">Making funny faces</option>
   </select>
  </div>
  <div>
   <label for="always">What they're always doing</label>
   <select id="always">
    <option value="tablet">Asking for "five more minutes" of screen time</option>
    <option value="talk">Talking. Like, all the time.</option>
    <option value="jump">Jumping on the couch</option>
    <option value="fort">Building blanket forts</option>
    <option value="pockets">Filling pockets with rocks</option>
    <option value="bored">Saying "I'm bored" five minutes into fun</option>
    <option value="hide">Hiding vegetables under the plate</option>
    <option value="prank">Trying to prank everybody</option>
   </select>
  </div>
 </div>
 <label class="check"><input type="checkbox" id="es"> Add "¡Feliz cumpleaños!" at the end</label>
 <div class="btns">
  <button type="submit" id="go">🔥 Roast 'em</button>
  <button type="button" id="again" disabled>🎲 New roast</button>
  <button type="button" id="print" disabled>🖨️ Print</button>
 </div>
 <p class="err" id="err" role="alert"></p>
 </form>
</div>

<div id="out" aria-live="polite">
 <div class="card roast">
  <h2 id="title"></h2>
  <ol id="lines"></ol>
 </div>
 <p class="hint">Tap "New roast" for different jokes. Same kid, fresh material.</p>
</div>

<footer>© 2026 KLC Automation LLC</footer>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var ageSel=$("age");
for(var a=3;a<=13;a++){var o=document.createElement("option");o.value=String(a);o.textContent=String(a);if(a===7)o.selected=true;ageSel.appendChild(o);}

function cleanName(s){
 s=String(s||"").normalize("NFC").replace(/[^\p{L}\p{M}' \-]/gu,"").replace(/\s+/g," ").trim().slice(0,20);
 if(!s)return "";
 return s.charAt(0).toUpperCase()+s.slice(1);
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

var FAV={
 dino:{t:"dinosaurs",l:[
  "{N} knows the name of every dinosaur ever, but still can't remember where the shoes go.",
  "{N} loves dinosaurs so much, we're pretty sure that last ROAR at breakfast was a real one.",
  "{N} says dinosaurs are extinct because they didn't get enough birthday cake. Very scientific."]},
 games:{t:"video games",l:[
  "{N} can beat level 50 in two minutes, but cleaning their room? That's the final boss.",
  "{N} has saved the world in video games about 400 times. Still hasn't found the TV remote.",
  "If {N} put as much energy into chores as into video games, this house would sparkle."]},
 soccer:{t:"sports",l:[
  "{N} can kick a ball across the whole field, but can't kick the habit of leaving socks everywhere.",
  "{N} practices victory dances way more than actual sports. Honestly? Great dances.",
  "{N} runs faster on the field than anyone, except when someone says 'time to go.'"]},
 unicorn:{t:"unicorns",l:[
  "{N} loves unicorns so much, we've checked their forehead for a horn. Twice.",
  "{N} believes unicorns are real, and honestly, after this much sugar, we might too.",
  "{N} is basically a unicorn: sparkly, magical, and almost impossible to catch at bath time."]},
 slime:{t:"slime",l:[
  "{N} has made so much slime, the couch has officially filed a complaint.",
  "{N} loves slime so much, we're still finding it in places slime should never be.",
  "{N}'s slime collection is bigger than the snack drawer. That's saying something."]},
 lego:{t:"LEGO",l:[
  "{N} can build a whole city out of LEGO, and then leave one tiny brick right where your foot goes.",
  "{N}'s LEGO creations are amazing. The LEGO on the floor at night? Less amazing.",
  "{N} builds towers taller than the fridge, then knocks them down for fun. Classic."]},
 draw:{t:"art",l:[
  "{N} is a true artist. The walls agree. The walls were not asked.",
  "{N} draws masterpieces every day. The fridge has officially run out of room.",
  "{N} has used every crayon in the box, plus a few markers that were 'just for grown-ups.'"]},
 dance:{t:"dancing",l:[
  "{N} dances everywhere: the kitchen, the hallway, the grocery store, the dentist's chair.",
  "{N} has more dance moves than socks that actually match.",
  "Play any song and {N} is dancing. Play no song and {N} is STILL dancing."]},
 space:{t:"space",l:[
  "{N} wants to be an astronaut, which makes sense, because getting them to bed is rocket science.",
  "{N} knows all the planets, but somehow their backpack is always lost in outer space.",
  "{N} has big plans to fly to the moon. First, let's try flying to the bathtub."]},
 cars:{t:"trucks and cars",l:[
  "{N} can name every truck on the road, but can't find the brakes when running down the hallway.",
  "{N} goes zero to sixty faster than a race car, especially when ice cream is involved.",
  "{N} has a garage full of toy cars and a parking spot for exactly none of them."]}
};
var HABIT={
 snacks:[
  "{N} asks for a snack so often, the pantry knows them by name.",
  "{N} has three favorite foods: snacks, more snacks, and 'what else do we have?'",
  "{N} just ate lunch and is already asking about dinner. And dessert. And second dessert."],
 shoe:[
  "{N} owns twelve pairs of shoes and can find exactly one shoe from each.",
  "{N} has lost so many single shoes, there's a sock monster somewhere wearing them all.",
  "Every morning, {N} plays everybody's favorite game: 'Where Is My Other Shoe?'"],
 bedtime:[
  "At bedtime, {N} suddenly needs water, a snack, a hug, another hug, and to tell you about their whole day.",
  "{N} has more bedtime excuses than a lawyer has papers.",
  "{N} says they're 'not tired' while yawning so big you can see their lunch."],
 zoomies:[
  "{N} gets the zoomies at 8 PM like it's their job, and they never miss a shift.",
  "{N} runs laps around the house for no reason. Scientists are still studying it.",
  "{N} has two speeds: asleep and FULL ZOOM."],
 hair:[
  "{N}'s morning hair looks like it went to a party without them.",
  "{N} wakes up with hair so wild, birds have tried to move in.",
  "{N}'s hair in the morning has its own personality, and it's very dramatic."],
 why:[
  "{N} asks 'why?' about 300 times a day. Why? Nobody knows. Not even {N}.",
  "{N} asks so many questions, the grown-ups had to start Googling in secret.",
  "{N} turns every answer into another 'but why?' Future scientist, current puzzle."],
 sing:[
  "{N} has sung the same song so many times, the neighbors know all the words now.",
  "{N} sings in the shower, in the car, at dinner... it's a world tour and we all have front-row seats.",
  "{N}'s favorite song has been played more times than anyone can count. Including the song."],
 faces:[
  "{N} makes funny faces in every single picture. We have zero normal photos. Zero.",
  "{N} has more funny faces than a whole circus of clowns.",
  "Ask {N} to smile for the camera and you get a goofy face every time. It's art."]
};
var ALWAYS={
 tablet:[
  "{N} has asked for 'five more minutes' so many times, that adds up to about three years.",
  "{N}'s favorite number? 'Five more minutes.' That's not a number, but try telling them.",
  "{N} can hear a screen turn on from three rooms away, but not 'come brush your teeth.'"],
 talk:[
  "{N} talks so much, even their imaginary friend needs a nap.",
  "{N} started a story in March. We're still waiting for the ending.",
  "{N} could talk the ears off a bunny, and the bunny would ask for a break."],
 jump:[
  "{N} jumps on the couch so much, the couch is thinking about getting a trampoline license.",
  "{N} treats every bed like a bounce house. Every. Single. Bed.",
  "{N} has jumped on the couch so much, it's practically springs now."],
 fort:[
  "{N} has built so many blanket forts, nobody in this house has a blanket anymore.",
  "{N}'s blanket fort has more rooms than this house.",
  "{N} builds forts with a strict 'no grown-ups allowed' rule. Unless they bring snacks."],
 pockets:[
  "{N} comes home with so many rocks in their pockets, the washing machine sounds like a drum solo.",
  "{N} has a rock collection, and most of it is still in their pockets.",
  "Check {N}'s pockets and you'll find rocks, sticks, a crayon, and possibly a lizard."],
 bored:[
  "{N} can be at an amusement park and still say 'I'm bored' by lunch.",
  "{N} says 'I'm bored' in a room full of toys. It's honestly impressive.",
  "{N} gets bored faster than a microwave popcorn bag pops."],
 hide:[
  "{N} hides veggies under their plate like a secret agent. Bad news, agent: we always find them.",
  "{N} has a broccoli-hiding technique so advanced, it should be in a spy movie.",
  "{N}'s napkin has eaten more peas than {N} has."],
 prank:[
  "{N} tries to prank everyone, but laughs so hard before the prank that it gives it away every time.",
  "{N} is a master prankster in training. Emphasis on 'in training.'",
  "{N} put a fake spider on the table and screamed louder than anybody."]
};
var OPEN=[
 "Friends, family, and cake fans, it's time to roast the one, the only, {N}!",
 "Okay, everybody, grab your cake and settle in, because we're roasting {N}!",
 "Welcome to the roast of {N}! Don't worry, we'll go easy... maybe.",
 "Today we're celebrating {N}, and by celebrating, we mean lovingly roasting."];
var AGE=[
 "{N} is turning {A}! That's {A} whole years of being the boss of this house.",
 "{A} years old! At this point, {N} is basically a grown-up. Somebody hand them the bills.",
 "{N} is {A} now, which means {A} candles, and the fire department on standby.",
 "{A} years old? {N}, that's old enough to know better, and young enough to do it anyway.",
 "Turning {A} means {N} is officially too cool for us. But not too cool for cake."];
var CLOSE=[
 "But seriously, {N}, you make every day more fun. Happy birthday, superstar! 🎉",
 "All jokes aside, we love you to the moon and back, {N}. Happy {A}th birthday! 🎂",
 "And even with all that, {N}, you're one of the coolest people we know. Happy birthday! 🥳",
 "We roast because we love, {N}. Have the best birthday ever! 🎈",
 "Okay, that's the roast. Now let's eat cake! Happy birthday, {N}! 🎂"];

function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function fill(t,N,A){return t.split("{N}").join(N).split("{A}th").join(ord(A)).split("{A}").join(String(A));}

var last={};
function pickNew(key,arr){if(arr.length<2)return arr[0];var x;do{x=pick(arr);}while(x===last[key]);last[key]=x;return x;}

function build(){
 var N=cleanName($("name").value), A=parseInt(ageSel.value,10);
 if(!N){$("err").textContent="Type the birthday kid's first name first (letters only).";return false;}
 if(!(A>=3&&A<=13))A=7;
 $("err").textContent="";
 var fav=FAV[$("fav").value]||FAV.dino, hb=HABIT[$("habit").value]||HABIT.snacks, al=ALWAYS[$("always").value]||ALWAYS.talk;
 var lines=[pickNew("o",OPEN),pickNew("a",AGE),pickNew("f",fav.l),pickNew("h",hb),pickNew("w",al)];
 var close=pickNew("c",CLOSE);
 var ol=$("lines"); while(ol.firstChild)ol.removeChild(ol.firstChild);
 lines.forEach(function(t){var li=document.createElement("li");li.textContent=fill(t,N,A);ol.appendChild(li);});
 var li=document.createElement("li");li.className="final";
 li.textContent=fill(close,N,A)+($("es").checked?" ¡Feliz cumpleaños!":"");
 ol.appendChild(li);
 $("title").textContent="🔥 The Roast of "+N+" 🔥";
 var out=$("out");out.classList.remove("show");void out.offsetWidth;out.classList.add("show");
 $("again").disabled=false;$("print").disabled=false;
 return true;
}
$("f").addEventListener("submit",function(e){e.preventDefault();if(build())$("out").scrollIntoView({behavior:"smooth",block:"start"});});
$("again").addEventListener("click",build);
$("print").addEventListener("click",function(){window.print();});
window.__ROAST__={FAV:FAV,HABIT:HABIT,ALWAYS:ALWAYS,OPEN:OPEN,AGE:AGE,CLOSE:CLOSE,fill:fill,cleanName:cleanName};
})();
</script>
</body>
</html>
